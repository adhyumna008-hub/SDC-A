<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant SDC Brand Cyber Gradient (Matches Site Accents: Neon Purple #A855F7 & Electric Cyan #38BDF8) -->
    <linearGradient id="sdc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="35%" stop-color="#A855F7" />
      <stop offset="70%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Bezel Horizon Specular Gradient -->
    <linearGradient id="sdc-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Soft Integrated Ambient Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagon Ambient Glow & Body -->
  <path d="M100 10 L180 55 L180 145 L100 190 L20 145 L20 55 Z" fill="url(#sdc-grad)" filter="url(#glow)"/>
  
  <!-- Outer Bezel Stroke -->
  <path d="M100 10 L180 55 L180 145 L100 190 L20 145 L20 55 Z" stroke="url(#sdc-border-grad)" stroke-width="1.5" fill="none" opacity="0.8"/>

  <!-- Inner Cyber Cavity -->
  <path d="M100 18 L172 59 L172 141 L100 182 L28 141 L28 59 Z" fill="#07080f" opacity="0.3"/>

  <!-- Gear Emblem -->
  <g transform="translate(100, 75) scale(0.92)" fill="#FFFFFF">
    <path d="M-5 -25 L5 -25 L7 -18 L14 -15 L20 -20 L27 -13 L22 -7 L25 0 L32 2 L32 12 L25 14 L22 21 L27 27 L20 34 L14 29 L7 32 L5 39 L-5 39 L-7 32 L-14 29 L-20 34 L-27 27 L-22 21 L-25 14 L-32 12 L-32 2 L-25 0 L-22 -7 L-27 -13 L-20 -20 L-14 -15 L-7 -18 Z" fill="#05060a" opacity="0.95"/>
    <!-- Gear Accent Bezel -->
    <circle cx="0" cy="7" r="14.5" fill="#A855F7"/>
    <!-- Code Brackets inside Gear -->
    <text x="0" y="12.5" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- SDC Brand Typography -->
  <text x="100" y="152" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SDC</text>
  
  <!-- Subtle Sub-label -->
  <text x="100" y="170" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="8" fill="#38BDF8" text-anchor="middle" letter-spacing="3" opacity="0.85">COMMUNITY</text>
</svg>
